name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    name: CI Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - name: Limitar la memoria de Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.workers.max=2
          org.gradle.daemon=false
          PROPS
      - name: Analizar el plugin
        run: |
          flutter pub get
          flutter analyze
      - name: Compilar el ejemplo
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug
